<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago de Nómina</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="#generar-formulario" id="generarFormulario">Generar Nómina</a></li>
            <li><a href="#preview" id="vistaPreview" style="display: none;">Vista Previa</a></li>
        </ul>
    </nav>

    <section class="body-container">
        <div id="generar-formulario" class="form-container">
            <h2>Generar Nómina</h2>
            <form id="formulario">
                <label for="mes">Mes:</label>
                <input type="number" id="mes" name="mes" min="1" max="12" required>
                <br>
                <label for="year">Año:</label>
                <input type="number" id="year" name="year" min="2000" required>
                <br>
                <label for="numero-cuenta">Número de Cuenta:</label>
                <select id="numero-cuenta" name="numeroCuenta" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="807931407">Cuenta APA - 807931407</option>
                    <option value="805693241">Cuenta 2 APA - 805693241</option>
                </select>
                <br>
                <label for="fecha-creacion">Fecha de Creación:</label>
                <input type="text" id="fecha-creacion" name="fechaCreacion" readonly>
                <br>
                <button type="submit" class="boton-generar-nomina">Generar Nómina</button>
            </form>
        </div>

        <div id="preview" class="form-container" style="display: none;">
            <h2>Vista Previa de Nómina</h2>
            <table id="tabla-nomina" border="1">
                <thead>
                    <tr>
                        <th>Documento</th>
                        <th>Cuenta</th>
                        <th>Salario</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <button id="pagarNomina" class="boton-pagar">Pagar</button>
        </div>
    </section>

    <script src="index.js"></script>
</body>
</html>
